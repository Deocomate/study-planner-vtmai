services:
  study-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-planner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - APP_BASE_URL=${APP_BASE_URL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - SETUP_CODE=${SETUP_CODE:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - MAIL_FROM=${MAIL_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - study_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  study_data:
    name: study_planner_data
