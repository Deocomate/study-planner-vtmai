<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Study Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Study Planner — layout and feel follow the "Work Calendar" reference: floating rounded top bar, centred menu,
   translucent cards, week strip, timeline, month grid. Dusty Bloom (dark) is the default, Lavender (light) is optional. */
:root {                                       /* Lavender (light) */
  --canvas: #f6f1fc; --surface: #fdfbff; --raised: #efe6f9; --line: #ddd0ef; --line2: #c5b0e2;
  --ink: #2a1a3c; --soft: #4d3b62; --faint: #6f5e85; --cream: #ffffff;
  --brand: #93408a; --brand-h: #7c3474; --brand-t: #a8336a; --pine: #3f7f78; --pine-d: #e2efed; --pine-t: #1d5f58;
  --bloom: #a066c8; --bloom-t: #7d3c9e; --sun: #d49a14; --sun-t: #8c5e00; --ok-bar: #3f7f78;
  --hdr-bg: #6c4f8b; --hdr-ink: #ffffff; --hdr-soft: #ece2f7; --hdr-raised: #7d61a0; --hdr-line: #9a80bb;
  --page: linear-gradient(135deg, #b89ad9 0%, #cf9fd3 45%, #c2b4e3 100%);
  --card-a: .92; --shadow: 0 6px 20px rgb(60 30 90 / .18); --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --c-maths: #2f6fdb; --c-esl: #d9731a; --c-science: #2b9b55; --c-english: #8d45d1; --c-other: #6b7a86; --c-x1: #0e8f9c; --c-x2: #b8451a; --c-x3: #b7266f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0d1514; --surface: #142120; --raised: #1b2c2a; --line: #263a38; --line2: #36504d;
  --ink: #eeedd9; --soft: #c2c5b3; --faint: #889691; --cream: #eeedd9;
  --brand: #ca5323; --brand-h: #b0461d; --brand-t: #e3916f; --pine: #315e5c; --pine-d: #213f3e; --pine-t: #8bbab5;
  --bloom: #d086ab; --bloom-t: #e3b3cb; --sun: #e6b545; --sun-t: #f0cd7d; --ok-bar: #5c918d;
  --hdr-bg: #142120; --hdr-ink: #eeedd9; --hdr-soft: #c2c5b3; --hdr-raised: #1b2c2a; --hdr-line: #263a38;
  --page: radial-gradient(ellipse 70% 60% at 0% 0%, #22716b 0%, transparent 70%), radial-gradient(ellipse 60% 55% at 100% 100%, #215451 0%, transparent 70%), linear-gradient(160deg, #10201f 0%, #0b1415 100%);
  --card-a: .82; --shadow: 0 6px 20px rgb(0 0 0 / .35);
  --c-maths: #7ea6ff; --c-esl: #ffb070; --c-science: #6fd58f; --c-english: #d3a4ff; --c-other: #a3b1ba; --c-x1: #5fd3df; --c-x2: #ff9a76; --c-x3: #ff8ec0; } }
:root[data-theme="dark"] {
  --canvas: #0d1514; --surface: #142120; --raised: #1b2c2a; --line: #263a38; --line2: #36504d;
  --ink: #eeedd9; --soft: #c2c5b3; --faint: #889691; --cream: #eeedd9;
  --brand: #ca5323; --brand-h: #b0461d; --brand-t: #e3916f; --pine: #315e5c; --pine-d: #213f3e; --pine-t: #8bbab5;
  --bloom: #d086ab; --bloom-t: #e3b3cb; --sun: #e6b545; --sun-t: #f0cd7d; --ok-bar: #5c918d;
  --hdr-bg: #142120; --hdr-ink: #eeedd9; --hdr-soft: #c2c5b3; --hdr-raised: #1b2c2a; --hdr-line: #263a38;
  --page: radial-gradient(ellipse 70% 60% at 0% 0%, #22716b 0%, transparent 70%), radial-gradient(ellipse 60% 55% at 100% 100%, #215451 0%, transparent 70%), linear-gradient(160deg, #10201f 0%, #0b1415 100%);
  --card-a: .82; --shadow: 0 6px 20px rgb(0 0 0 / .35);
  --c-maths: #7ea6ff; --c-esl: #ffb070; --c-science: #6fd58f; --c-english: #d3a4ff; --c-other: #a3b1ba; --c-x1: #5fd3df; --c-x2: #ff9a76; --c-x3: #ff8ec0; }
:root[data-holiday] { --ha: #e6b545; --hb: #ca5323; }
:root[data-holiday="halloween"] { --ha: #ffd166; --hb: #ea580c; } :root[data-holiday="christmas"] { --ha: #e04848; --hb: #2f9a62; } :root[data-holiday="new-year"] { --ha: #f0cd7d; --hb: #d086ab; }
:root[data-holiday="tet"] { --ha: #f5c518; --hb: #e0302b; } :root[data-holiday="mid-autumn"] { --ha: #f5d76e; --hb: #f08a24; } :root[data-holiday="teachers-day"] { --ha: #f2c14e; --hb: #3d8bd9; }
:root[data-holiday="childrens-day"] { --ha: #7dd3fc; --hb: #f472b6; } :root[data-holiday="national-day"] { --ha: #ffcd00; --hb: #da251d; } :root[data-holiday="back-to-school"] { --ha: #86efac; --hb: #3b82f6; }
* { box-sizing: border-box; } html { color-scheme: dark light; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: var(--font); color: var(--ink); background: var(--canvas); background-image: var(--page); background-attachment: fixed; -webkit-font-smoothing: antialiased; line-height: 1.5; font-size: 15px; }
h1, h2, h3, p { margin: 0; } button, input, select, textarea { font: inherit; color: inherit; } button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.container-page { width: 100%; max-width: 1152px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { flex: 1; padding-top: 28px; padding-bottom: 32px; }
footer { border-top: 1px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: .75rem; color: var(--faint); }
.holiday-sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
/* header */
.app-header { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 40; margin: calc(8px + env(safe-area-inset-top, 0px)) 12px 0; border: 1px solid var(--hdr-line); border-radius: 16px; background: color-mix(in srgb, var(--hdr-bg) 88%, transparent); backdrop-filter: blur(10px); box-shadow: var(--shadow); color: var(--hdr-ink); }
:root[data-holiday] .app-header { border-color: color-mix(in srgb, var(--ha) 45%, transparent); box-shadow: 0 6px 26px color-mix(in srgb, var(--ha) 28%, transparent), 0 10px 15px rgb(0 0 0 / .25); }
.hbar { display: flex; align-items: center; gap: 8px 24px; min-height: 56px; padding: 6px 12px; }
.hside { display: flex; align-items: center; flex: 1; min-width: 0; } .hside.right { justify-content: flex-end; gap: 8px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--hdr-ink); text-decoration: none; white-space: nowrap; } .logo svg { width: 34px; height: 34px; flex: none; }
.nav { display: flex; gap: 4px; overflow-x: auto; flex: 0 1 auto; scrollbar-width: none; } .nav::-webkit-scrollbar { display: none; }
.nav button { position: relative; border: 0; background: transparent; color: var(--hdr-soft); font-weight: 500; font-size: .875rem; padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
.nav button:hover { background: var(--hdr-raised); color: var(--hdr-ink); } .nav button[aria-current="page"] { background: color-mix(in srgb, var(--pine) 55%, transparent); color: var(--cream); }
:root:not([data-theme="dark"]) .nav button[aria-current="page"] { background: var(--pine); color: #fff; }
.cnt { display: inline-flex; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; align-items: center; justify-content: center; border-radius: 99px; background: var(--brand); color: #fff; font-size: .7rem; font-weight: 700; }
.iconbtn { border: 0; background: transparent; color: var(--hdr-soft); padding: 7px 9px; border-radius: 10px; font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; } .iconbtn:hover { background: var(--hdr-raised); color: var(--hdr-ink); } .iconbtn svg { width: 18px; height: 18px; }
.who { display: inline-flex; background: var(--hdr-raised); border-radius: 999px; padding: 3px; gap: 2px; } .who button { border: 0; background: transparent; color: var(--hdr-soft); font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.who button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.hold { position: absolute; top: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; transform-origin: top center; animation: swing 3s ease-in-out infinite alternate; user-select: none; }
.hold::before { content: ""; width: 2px; height: 28px; background: linear-gradient(#d8c7a3, #a8936a); border-radius: 2px; margin-bottom: -10px; z-index: 1; }
.hold.l { left: 22px; font-size: 1.9rem; animation-duration: 2.8s; } .hold.l::before { height: 14px; width: 1px; margin-bottom: 2px; }
.hold.r { right: 24px; }
.htag { width: 78px; height: 78px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1; padding-top: 8px; position: relative; color: #fff; text-shadow: 0 1px 1px rgb(0 0 0 / .35);
  background: radial-gradient(circle at 30% 22%, rgb(255 255 255 / .22), transparent 45%), linear-gradient(165deg, var(--hb) 0%, color-mix(in srgb, var(--hb) 40%, var(--canvas)) 100%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), inset 0 -6px 10px rgb(0 0 0 / .18), 0 10px 14px -6px rgb(0 0 0 / .55); }
.htag::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px dashed rgb(255 255 255 / .45); } .htag::before { content: ""; position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: rgb(0 0 0 / .45); box-shadow: 0 0 0 2px #c9ae72; }
.htag b { font-size: 1.5rem; font-weight: 800; } .htag span { font-size: .68rem; font-weight: 600; margin-top: 2px; white-space: nowrap; } .htag i { position: absolute; right: -6px; bottom: -4px; font-size: 1rem; font-style: normal; rotate: 16deg; text-shadow: none; }
:root:not([data-theme="dark"]) .htag { color: #2a1a3c; text-shadow: none; background: radial-gradient(circle at 30% 22%, rgb(255 255 255 / .7), transparent 50%), linear-gradient(165deg, color-mix(in srgb, var(--ha) 70%, white) 0%, var(--surface) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .htag { color: #fff; } }
@keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } } @keyframes fall { to { transform: translate3d(var(--dr, 0), 110vh, 0) rotate(var(--sp, 0deg)); } }
.flake { position: absolute; top: -40px; font-size: 1.3rem; opacity: .5; animation: fall linear infinite; user-select: none; }
/* page parts */
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; } .phead h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; } .phead p { color: var(--soft); font-size: .9rem; margin-top: 2px; } .phead .acts { margin-right: 0; } [data-holiday] .phead { padding-right: 70px; } .phead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 8px 16px; font-size: .875rem; font-weight: 500; text-decoration: none; transition: .15s; line-height: 1.25; white-space: nowrap; }
.btn:disabled { opacity: .5; pointer-events: none; } .btn.sm { padding: 5px 12px; font-size: .75rem; } .btn.icon { width: 38px; height: 38px; padding: 0; }
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); } .btn.primary:hover { background: var(--brand-h); }
.btn.secondary { background: var(--raised); color: var(--ink); border-color: var(--line2); } .btn.secondary:hover { border-color: var(--pine); background: var(--pine-d); }
.btn.ghost { background: transparent; color: var(--soft); } .btn.ghost:hover { background: var(--raised); color: var(--ink); } .btn.danger { background: var(--brand-h); color: #fff; } .btn.ok { background: var(--pine); color: #fff; }
.card { border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) calc(var(--card-a) * 100%), transparent); box-shadow: 0 1px 3px rgb(0 0 0 / .12); backdrop-filter: blur(4px); min-width: 0; }
.pad { padding: 18px 20px; } .mb { margin-bottom: 20px; } .stackc { display: grid; gap: 12px; } .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .between { justify-content: space-between; }
.muted { color: var(--faint); } .soft { color: var(--soft); } .small { font-size: .8rem; } .tab { font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 1px 10px; font-size: .72rem; font-weight: 600; white-space: nowrap; background: var(--raised); color: var(--soft); box-shadow: inset 0 0 0 1px var(--line2); }
.b-green { background: color-mix(in srgb, var(--pine) 40%, transparent); color: var(--pine-t); box-shadow: none; } .b-yellow { background: color-mix(in srgb, var(--sun) 16%, transparent); color: var(--sun-t); box-shadow: none; }
.b-red { background: color-mix(in srgb, var(--brand) 20%, transparent); color: var(--brand-t); box-shadow: none; } .b-pink { background: color-mix(in srgb, var(--bloom) 16%, transparent); color: var(--bloom-t); box-shadow: none; }
.prog { height: 8px; border-radius: 99px; background: var(--canvas); overflow: hidden; } .prog > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--ok-bar), var(--sun)); transition: width .5s; }
.prog.l1 > i { background: var(--ok-bar); } .prog.l2 > i { background: var(--sun); } .prog.l3 > i { background: var(--brand); }
/* week strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); overflow: hidden; } .sday { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 0; border-right: 1px solid var(--line); background: transparent; text-align: left; min-width: 0; color: var(--ink); }
.sday:last-child { border-right: 0; } .sday:hover { background: color-mix(in srgb, var(--pine) 22%, transparent); } .sday[aria-current="date"] { background: color-mix(in srgb, var(--pine) 28%, transparent); }
.sd-top { display: flex; flex-direction: column; align-items: center; gap: 2px; } .sd-w { font-size: .7rem; font-weight: 600; color: var(--faint); }
.sd-n { display: inline-flex; min-width: 30px; height: 30px; padding: 0 4px; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: .88rem; } .sday.today .sd-n { background: var(--brand); color: #fff; } .sday.past .sd-n { color: var(--faint); }
.sd-c { font-size: .7rem; font-weight: 600; } .sd-list { display: none; margin: 4px 0 0; padding: 0; list-style: none; min-width: 0; width: 100%; }
.sd-list li { font-size: .78rem; line-height: 1.3; margin-bottom: 5px; overflow-wrap: anywhere; } .sd-list li.done { color: var(--faint); text-decoration: line-through; } .sd-list li.doing { color: var(--sun-t); }
@media (min-width: 768px) { .sday { padding: 10px; gap: 5px; } }
/* summary + timeline */
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.task { display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) calc(var(--card-a) * 100%), transparent); box-shadow: 0 1px 3px rgb(0 0 0 / .12); backdrop-filter: blur(4px); transition: border-color .15s; }
.task:hover { border-color: var(--line2); } .task.now { box-shadow: 0 0 0 2px color-mix(in srgb, var(--bloom) 70%, transparent); }
.t-time { width: 56px; flex: none; text-align: right; padding-top: 2px; font-size: .875rem; } .t-time b { display: block; font-weight: 600; } .t-time span { font-size: .75rem; color: var(--faint); }
.t-body { flex: 1; min-width: 0; border-left: 4px solid var(--line2); padding-left: 14px; } .t-body.s-doing { border-color: var(--sun); } .t-body.s-done { border-color: var(--ok-bar); } .t-body.s-late { border-color: var(--brand); }
.t-title { font-weight: 600; } .t-title.done { color: var(--faint); text-decoration: line-through; } .t-meta { font-size: .75rem; color: var(--faint); margin-top: 2px; } .t-note { margin-top: 6px; font-size: .875rem; color: var(--soft); white-space: pre-line; overflow-wrap: anywhere; }
.pre { font-size: .75rem; font-weight: 600; padding: 1px 9px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); white-space: nowrap; }
.sub-maths { --c: var(--c-maths); } .sub-esl { --c: var(--c-esl); } .sub-science { --c: var(--c-science); } .sub-english { --c: var(--c-english); } .sub-other { --c: var(--c-other); } .sub-x1 { --c: var(--c-x1); } .sub-x2 { --c: var(--c-x2); } .sub-x3 { --c: var(--c-x3); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; } .links a { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: .75rem; font-weight: 500; color: var(--bloom-t); text-decoration: none; } .links a:hover { border-color: var(--bloom); background: color-mix(in srgb, var(--bloom) 8%, transparent); }
.acts2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.sect { border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent); background: color-mix(in srgb, var(--sun) 6%, transparent); border-radius: 14px; padding: 16px; margin-bottom: 22px; } .sect h2 { font-size: .875rem; font-weight: 600; color: var(--sun-t); margin-bottom: 12px; }
.empty { text-align: center; padding: 36px 16px; border: 1px dashed var(--line2); border-radius: 14px; background: color-mix(in srgb, var(--surface) 60%, transparent); } .empty svg { width: 130px; height: auto; margin-bottom: 8px; } .empty h3 { font-size: 1.05rem; } .empty p { color: var(--soft); font-size: .9rem; margin: 4px 0 14px; }
/* month */
.mhead, .mrow { display: grid; grid-template-columns: repeat(7, 1fr); } .mhead { border-bottom: 1px solid var(--line); background: var(--raised); text-align: center; font-size: .75rem; font-weight: 600; color: var(--faint); } .mhead div { padding: 8px 0; }
.mrow { border-bottom: 1px solid var(--line); } .mrow:last-child { border-bottom: 0; }
.mcell { min-height: 64px; padding: 4px; border: 0; border-right: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink); min-width: 0; } .mcell:last-child { border-right: 0; } .mcell:hover { background: color-mix(in srgb, var(--pine) 25%, transparent); } .mcell.out { background: color-mix(in srgb, var(--canvas) 60%, transparent); color: var(--faint); }
.mtop { display: flex; justify-content: space-between; align-items: center; } .mnum { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border-radius: 50%; font-size: .75rem; font-weight: 500; } .mcell.today .mnum { background: var(--brand); color: #fff; }
.mdot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-t); } .mchips { display: none; margin: 4px 0 0; padding: 0; list-style: none; } .mchips li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .75rem; padding: 1px 6px; border-radius: 4px; margin-bottom: 4px; background: var(--raised); }
.mchips li.done { background: color-mix(in srgb, var(--pine) 40%, transparent); color: var(--pine-t); } .mchips li.doing { background: color-mix(in srgb, var(--sun) 15%, transparent); color: var(--sun-t); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sun) 40%, transparent); }
.mcnt { text-align: center; font-size: .7rem; font-weight: 600; margin-top: 4px; } @media (min-width: 640px) { .mcell { min-height: 112px; padding: 8px; } .mchips { display: block; } .mcnt { display: none; } }
/* forms */
.f { display: grid; gap: 6px; } .label { font-size: .85rem; font-weight: 500; color: var(--soft); } .hint { font-size: .75rem; color: var(--faint); }
.input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--canvas); padding: 8px 12px; font-size: .875rem; color: var(--ink); min-width: 0; } .input:hover { border-color: var(--line2); } .input:focus { outline: none; border-color: var(--pine); box-shadow: 0 0 0 2px color-mix(in srgb, var(--pine) 50%, transparent); } textarea.input { min-height: 70px; resize: vertical; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; } .fsec { display: grid; gap: 14px; } .fsec + .fsec { border-top: 1px solid var(--line); padding-top: 18px; } .fsec > h3 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

  const safeUrl = (v) => { v = String(v || '').trim(); if (!v) return ''; if (!/^https?:\/\//i.test(v)) { if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) v = `https://${v}`; else return ''; } try { return new URL(v).href; } catch (e) { return ''; } };
