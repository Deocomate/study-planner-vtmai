services:
  study-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-planner
    restart: unless-stopped
    # Dùng expose thay vì ports để tránh trùng port trên máy chủ/VPS.
    # Coolify (Traefik) sẽ định tuyến qua mạng nội bộ Docker tới port 3000.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - WEB_DIR=/app/web-app
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      # Mật khẩu bảo vệ trang web (tuỳ chọn, nên đặt). Để trống = ai có link cũng vào được.
      - APP_USER=${APP_USER:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Dung lượng tối đa: mỗi file đính kèm / file .zip khi nhập dữ liệu (MB)
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-20}
      - MAX_IMPORT_MB=${MAX_IMPORT_MB:-1024}
      # Số bản sao lưu tự động giữ lại trên máy chủ (/data/backups)
      - KEEP_BACKUPS=${KEEP_BACKUPS:-30}
    volumes:
      # Cơ sở dữ liệu SQLite + bản sao lưu tự động nằm ở đây, không mất khi redeploy
      - study_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  study_data:
    name: study_planner_data
